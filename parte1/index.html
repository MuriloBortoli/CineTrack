<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="cinetrack">CineTrack</h1>
        <input type="text" name="busca" id="busca" aria-label="Buscar filme" placeholder="Buscar filme">
        <button id="adicionar">
            <span class="mobile">+</span>
            <span class="desktop">+ Adicionar</span>
        </button>
    </header>

    <nav aria-label="Filtros de status">
        <button class="ativo" data-status="todos">Todos</button>
        <button data-status="assistido">Assistido</button>
        <button data-status="assistindo">Assistindo</button>
        <button data-status="quero">Quero assistir</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite"></section>
    </main>

    <footer>
        <small>CineTrack - UEM</small>
    </footer>

    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-modal" hidden>
        <div class="modal-conteudo">
            <h2 id="titulo-modal">Adicionar filme</h2>
            <form id="form-filme">
                <div class="campo">
                    <label for="titulo">Título</label>
                    <input type="text" name="titulo" id="titulo" required>
                </div>

                <div class="campo">
                    <label for="ano">Ano</label>
                    <input type="number" name="ano" id="ano" min="1888" max="2030" required>
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <input type="text" name="genero" id="genero" required>
                </div>

                <div class="campo">
                    <label for="poster">URL do pôster</label>
                    <input type="text" name="poster" id="poster">
                </div>

                <div class="campo">
                    <label for="status">Status</label>
                    <select name="status" id="status" required>
                        <option value="quero">Quero assistir</option>
                        <option value="assistindo">Estou assistindo</option>
                        <option value="assistido">Já assisti</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="nota">Nota (1 a 5)</label>
                    <input type="number" name="nota" id="nota" min="1" max="5" required>
                </div>

                <div class="campo">
                    <label for="comentario">Comentário</label>
                    <input type="text" name="comentario" id="comentario">
                </div>

                <div class="acoes-form">
                    <button type="button" id="cancelar">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
