<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="cinetrack">CineTrack</h1>
        <input type="text" name="busca" id="busca" aria-label="Buscar filme" placeholder="Buscar filme">
        <button style="background-color: #73E2A7;" id="adicionar">
            <span class="mobile">+</span>
            <span class="desktop">+ Adicionar   </span>
        </button>  
    </header>
    <nav aria-label="Filtros de status">
        <button class="ativo">Todos</button>
        <button>Assistido</button>
        <button>Assistindo</button>
        <button>Quero assistir</button>
    </nav>
    <main>
        <section id="lista" aria-live="polite">
        </section>
        <footer>
            <small>CineTrack - UEM</small>
            <br>
            <a href="adicionar.html">Adicionar filme</a>
        </footer>
    </main>

    <div id="modal" hidden>
        <div class="modal-conteudo">
            <form action="" id="form-filme">
                    <label for="titulo">Título</label><br>
                    <input type="text" name="titulo" id="titulo" required>
                    <br>
                    <label for="ano">Ano</label>
                    <br>
                    <input type="number" name="ano" id="ano" min="1888" max="2030" required>
                    <br>
                    <label for="genero">Gênero</label>
                    <br>
                    <input type="text" name="genero" id="genero" required>
                    <br>
                    <label for="url">URL do pôster</label>
                    <br>
                    <input type="text" name="url" id="url">
                    <br>
                    <label for="status">Status</label>
                    <br>
                    <select name="status" id="status" required>
                        <option value="assistir">Quero assistir</option>
                        <option value="assistindo">Estou assistindo</option>
                        <option value="assistido">Já assisti</option>
                    </select>
                    <br>
                    <label for="nota">Nota(1 a 5)</label><br>
                    <input type="number" name="nota" id="nota" min="1" max="5">
                    <br>
                    <label for="comentario">Comentário</label>
                    <br>

                    <input type="text" name="comentario" id="comentario">
                    <br>

                    <button type="button">Cancelar</button>
                    <button type="submit">Salvar</button>    
                </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
