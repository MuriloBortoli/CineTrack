<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="index.html">&leftarrow; Voltar</a>
    <h2>Adicionar filme</h2>
    <form action="" id="formulario">
        <label for="titulo">Título</label><br>
        <input type="text" name="titulo" id="titulo" required>
        <br>
        <label for="ano">Ano</label>
        <br>
        <input type="number" name="ano" id="ano" min="1888" max="2030" required>
        <br>
        <label for="genero">Gênero</label>
        <br>
        <input type="text" name="genero" id="genero" required>
        <br>
        <label for="url">URL do pôster</label>
        <br>
        <input type="text" name="url" id="url">
        <br>
        <label for="status">Status</label>
        <br>
        <select name="status" id="status" required>
            <option value="assistir">Quero assistir</option>
            <option value="assistindo">Estou assistindo</option>
            <option value="assistido">Já assisti</option>
        </select>
        <br>
        <label for="nota">Nota(1 a 5)</label><br>
        <input type="number" name="nota" id="nota" min="1" max="5">
        <br>
        <label for="comentario">Comentário</label>
        <br>

        <input type="text" name="comentario" id="comentario">
        <br>

        <button type="button">Cancelar</button>
        <button type="submit">Salvar</button>

                
    </form>

    
</body>
</html>
